# Override de observabilidade da Semana 1: Aspire Dashboard standalone recebendo OTLP da API e do Worker.
# Sem este arquivo o Lab sobe igual a antes (o exporter OTLP só liga com OTEL_EXPORTER_OTLP_ENDPOINT).
#
#   docker compose -f docker-compose.yml -f compose.aspire.yml up -d --build
#   UI: http://localhost:18888
#
# O dashboard guarda tudo em memória: reiniciar o container apaga traces, logs e métricas.

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=lab

services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.0
    environment:
      # Lab local: UI e OTLP sem autenticação. Por isso a UI só escuta em 127.0.0.1 no host,
      # e a porta OTLP (18889) nem é publicada: só a rede do Compose alcança.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"

  api:
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: autorizador-api
    depends_on:
      aspire-dashboard:
        condition: service_started

  worker:
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: terminal-worker
    depends_on:
      aspire-dashboard:
        condition: service_started
